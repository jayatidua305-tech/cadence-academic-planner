<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px; min-height: 200px; max-height: 600px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117; color: #f0f2ff; overflow: hidden;
    }

    /* Header */
    .header {
      padding: 14px 16px 12px;
      background: linear-gradient(135deg, #1a1d27, #22263a);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; gap: 10px;
    }
    .logo { font-size: 1.4rem; }
    .header-text h1 { font-size: 0.9rem; font-weight: 700; }
    .header-text p  { font-size: 0.68rem; color: #8b90b0; margin-top: 1px; }
    .open-btn {
      margin-left: auto; padding: 5px 12px; border-radius: 20px;
      border: 1px solid rgba(124,111,247,0.4);
      background: rgba(124,111,247,0.15); color: #a89ef8;
      font-size: 0.72rem; font-weight: 600; cursor: pointer;
      text-decoration: none;
    }
    .open-btn:hover { background: rgba(124,111,247,0.25); }

    /* Date bar */
    .date-bar {
      padding: 8px 16px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.72rem; color: #8b90b0;
      display: flex; justify-content: space-between; align-items: center;
    }
    .stats { display: flex; gap: 12px; }
    .stat { font-size: 0.7rem; }
    .stat strong { color: #f0f2ff; }

    /* Task list */
    .tasks { overflow-y: auto; max-height: 380px; padding: 8px; }

    .section-label {
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: #4a4f6a;
      padding: 6px 8px 4px;
    }

    .task-item {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 10px; border-radius: 8px; margin-bottom: 5px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      transition: background 0.1s;
    }
    .task-item.peak   { border-left: 3px solid #7c6ff7; background: rgba(124,111,247,0.08); }
    .task-item.medium { border-left: 3px solid #4f9fff; background: rgba(79,159,255,0.07); }
    .task-item.low    { border-left: 3px solid #2dd4bf; background: rgba(45,212,191,0.07); }
    .task-item.done   { opacity: 0.45; border-left-color: #4ade80 !important; }
    .task-item.overdue{ border-left: 3px solid #f87171; background: rgba(248,113,113,0.08); }

    .task-time {
      font-family: 'Courier New', monospace; font-size: 0.68rem;
      color: #8b90b0; min-width: 72px; line-height: 1.4; flex-shrink: 0;
    }
    .task-item.peak   .task-time { color: #a89ef8; }
    .task-item.medium .task-time { color: #82bbff; }
    .task-item.low    .task-time { color: #2dd4bf; }
    .task-item.overdue .task-time { color: #f87171; }

    .task-info { flex: 1; min-width: 0; }
    .task-title {
      font-size: 0.78rem; font-weight: 600; color: #f0f2ff;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .task-item.done .task-title { text-decoration: line-through; color: #8b90b0; }
    .task-sub { font-size: 0.65rem; color: #4a4f6a; margin-top: 1px; }
    .task-item.overdue .task-sub { color: #f87171; }

    .done-btn {
      padding: 3px 8px; border-radius: 6px; border: none;
      font-size: 0.68rem; font-weight: 700; cursor: pointer;
      flex-shrink: 0; transition: all 0.1s;
    }
    .done-btn.mark   { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
    .done-btn.mark:hover { background: rgba(74,222,128,0.3); }
    .done-btn.marked { background: rgba(74,222,128,0.1); color: #4ade80; border: 1px solid rgba(74,222,128,0.2); cursor: default; }

    /* Empty state */
    .empty {
      text-align: center; padding: 32px 20px; color: #4a4f6a;
    }
    .empty .emoji { font-size: 2rem; margin-bottom: 8px; }
    .empty p { font-size: 0.8rem; line-height: 1.6; }
    .empty a { color: #7c6ff7; text-decoration: none; font-weight: 600; }

    /* Overdue section */
    .overdue-section {
      margin: 4px 8px 6px;
      background: rgba(248,113,113,0.06);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: 8px; padding: 6px 8px;
    }
    .overdue-label {
      font-size: 0.65rem; font-weight: 700; color: #f87171;
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    /* Footer */
    .footer {
      padding: 8px 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.02);
    }
    .footer-text { font-size: 0.65rem; color: #4a4f6a; }
    .footer-link {
      font-size: 0.65rem; color: #7c6ff7; text-decoration: none; font-weight: 600;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🗓️</div>
    <div class="header-text">
      <h1>Smart Calendar</h1>
      <p>AI Productivity · Fordham 2026</p>
    </div>
    <a class="open-btn" id="open-app" href="#" target="_blank">Open App →</a>
  </div>

  <div class="date-bar">
    <span id="date-label">Loading...</span>
    <div class="stats">
      <span class="stat"><strong id="total-count">—</strong> tasks</span>
      <span class="stat"><strong id="done-count">—</strong> done</span>
      <span class="stat" id="archetype-label"></span>
    </div>
  </div>

  <div class="tasks" id="task-list">
    <div class="empty">
      <div class="emoji">⏳</div>
      <p>Loading your schedule...</p>
    </div>
  </div>

  <div class="footer">
    <span class="footer-text" id="sync-label">Last sync: —</span>
    <a class="footer-link" href="http://localhost:3000" target="_blank">Open full app</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
